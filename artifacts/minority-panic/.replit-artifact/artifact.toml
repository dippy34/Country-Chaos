kind = "web"
previewPath = "/"
title = "Minority Panic: Country Chaos"
version = "1.0.0"
id = "artifacts/minority-panic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20309

[services.development]
run = "pnpm --filter @workspace/minority-panic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/minority-panic", "run", "build" ]
publicDir = "artifacts/minority-panic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20309"
BASE_PATH = "/"
